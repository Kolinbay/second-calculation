<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Index Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/heroicons@2.0.16/dist/24/outline/heroicons.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
            position: relative;
        }

        header img {
            height: 40px;
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #007BFF;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
        }

        .menu-toggle svg {
            width: 28px;
            height: 28px;
        }

        .mobile-nav {
            display: none;
            flex-direction: column;
            gap: 10px;
            text-decoration: none;
            background: #fff;
            position: absolute;
            top: 60px;
            right: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 2s ease, transform 2s ease;
            z-index: 999;
        }

        .mobile-nav.show {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        main {
            flex: 1;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            margin: 0 10%;
            width: 100%;
        }

        main img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        footer {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #888;
            background: #f1f1f1;
        }

        @media (max-width: 500px) {
            nav.desktop {
                display: none;
            }

            .menu-toggle {
                display: block;
            }

            .main-container {
                margin: 0 5%;
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="KD LogoK.png" alt="Logo" />
        <nav class="desktop">
            <a href="quarter.html">3 Mths Request</a>
            <a href="bi-annual.html">6 Mths Request</a>
            <a href="formula.html">Formula</a>
            <a href="#form">Form</a>
        </nav>
        <button class="menu-toggle" onclick="toggleMenu()">
            <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <div class="mobile-nav" id="mobileNav">
            <a href="quarter.html">3 Mths Request</a>
            <a href="bi-annual.html">6 Mths Request</a>
            <a href="formula.html">Formula</a>
            <a href="#form">Form</a>
        </div>
    </header>

    <main>
        <div class="main-container">
            <h1>ဆေးဝါးတောင်းဆိုရန် ပုံသေနည်း။</h1>
            <p>
                ၁။ အရင်ဦးဆုံး လွန်ခဲ့တဲ့လများအသုံးစာရေးစုစုပေါင်းစာရေးစုပါ။ (သုံးလ၊ ခြောက်လစသဖြင့်) <br>
                ၂။ ယခုလက်ကျန်စာရေးစစ်ပါ။
            </p>
            <img src="KD LogoK.png" alt="Dashboard Overview" />
        </div>
    </main>

    <footer>
        &copy; 2025 Your Organization. All rights reserved.
    </footer>

    <script>
        const menuIcon = document.getElementById('menu-icon');
        const mobileNav = document.getElementById('mobileNav');

        let isOpen = false;

        function toggleMenu() {
            isOpen = !isOpen;
            mobileNav.classList.toggle('show');

            if (isOpen) {
                menuIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M6 18L18 6M6 6l12 12" />
        `;
            } else {
                menuIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
        `;
            }
        }
    </script>
</body>

</html>
